# Betrieb mit FERTIG GEBAUTEM Image aus dem Internet (GitHub Container Registry).
# Kein Bauen auf dem NAS, kein ZIP-Upload. Update = neues Image laden + neu starten.
#
# Verwendung im Synology Container Manager (Projekt):
#   1. Diese Datei als docker-compose.yml in einen Ordner legen (z. B. /docker/jugend-cisns)
#   2. Im selben Ordner eine .env anlegen (siehe .env.example) mit JWT_SECRET, ADMIN_*
#   3. Container Manager -> Projekt -> Erstellen -> diesen Ordner wählen
#
# Automatische Updates: Der mitgelieferte "watchtower"-Dienst prüft täglich, ob
# eine neue Version im Internet liegt, lädt sie und tauscht den Container von
# selbst aus (Daten bleiben erhalten). Nach der EINMALIGEN Ersteinrichtung ist
# damit kein manuelles Update mehr nötig.
#
# Ersteinrichtung im Synology Container Manager:
#   1. Diese Datei als docker-compose.yml in einen Ordner legen (z. B. /docker/jugend-cisns)
#   2. Im selben Ordner eine .env anlegen (siehe .env.example) mit JWT_SECRET, ADMIN_*
#   3. Container Manager -> Projekt -> Erstellen -> diesen Ordner wählen

services:
  app:
    image: ghcr.io/clementeb2001/cisns-jugend:latest
    container_name: jf-praesenz
    restart: unless-stopped
    pull_policy: always          # beim (Neu-)Erstellen immer die neueste Version holen
    ports:
      - "3000:3000"              # Reverse Proxy / Cloudflare Tunnel zeigt hierhin
    env_file:
      - .env                     # JWT_SECRET, ADMIN_USERNAME, ADMIN_PIN aus .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/jugendfeuerwehr.db
      FRONTEND_DIR: /frontend
    volumes:
      - jf-data:/data            # persistente SQLite-DB (bleibt über Updates erhalten)

  # Automatische Updates NUR für den Container "jf-praesenz".
  # Andere Container auf dem NAS (z. B. Home Assistant, Cloudflare Tunnel) werden
  # bewusst NICHT angefasst, da hier gezielt nur "jf-praesenz" überwacht wird.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: jf-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # nötig, um Container zu aktualisieren
    environment:
      TZ: Europe/Luxembourg
      WATCHTOWER_CLEANUP: "true"                     # altes Image nach Update entfernen
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"             # täglich um 04:00 Uhr prüfen
    command: jf-praesenz                              # nur diesen Container überwachen

volumes:
  jf-data:
