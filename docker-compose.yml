# Docker Compose für den Betrieb auf dem Synology DS225+ NAS.
# Der bereits vorhandene Reverse Proxy (Web Station) leitet HTTPS-Traffic
# (Let's Encrypt) auf den hier veröffentlichten Port 3000 weiter.
#
# Hinweis: Die Konfiguration wird über die Datei .env (im selben Ordner)
# per env_file in den Container geladen. So funktioniert es auch im Synology
# Container Manager, der Variablen-Ersetzung (${VAR}) beim Erstellen nicht
# unterstützt. Die .env MUSS vorhanden sein (siehe .env.example).

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: jugendfeuerwehr-praesenz:latest
    container_name: jf-praesenz
    restart: unless-stopped
    ports:
      - "3000:3000"          # Reverse Proxy nach hier weiterleiten
    env_file:
      - .env                 # JWT_SECRET, ADMIN_USERNAME, ADMIN_PIN, ... kommen aus .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/jugendfeuerwehr.db
      FRONTEND_DIR: /frontend
    volumes:
      - jf-data:/data        # persistente SQLite-DB auf dem NAS

  # Tägliches Backup der SQLite-Datenbank (dump ins Backup-Verzeichnis)
  backup:
    image: jugendfeuerwehr-praesenz:latest
    container_name: jf-backup
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DB_PATH: /data/jugendfeuerwehr.db
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: "30"
    volumes:
      - jf-data:/data:ro
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro

volumes:
  jf-data:
