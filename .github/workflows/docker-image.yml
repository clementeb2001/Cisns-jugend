name: Docker-Image bauen und veröffentlichen

# Baut das fertige App-Image und lädt es in die GitHub Container Registry (GHCR)
# hoch: ghcr.io/clementeb2001/cisns-jugend
#
# Danach kann der Synology Container Manager das Image direkt herunterladen –
# ohne ZIP-Upload und ohne auf dem NAS zu bauen. Update = "neuestes Image laden".

on:
  push:
    branches: ['main', 'claude/jugendfeuerwehr-attendance-pwa-c2wwzw']
    tags: ['v*']
  workflow_dispatch:            # per Knopfdruck manuell startbar

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # clementeb2001/Cisns-jugend -> wird kleingeschrieben

jobs:
  build-and-push:
    name: Multi-Arch-Image bauen (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # zum Pushen ins GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Image-Namen sicher kleinschreiben (GHCR akzeptiert nur Kleinbuchstaben)
      - name: Image-Namen normalisieren
        id: img
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: QEMU einrichten (für arm64-Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Bauen und pushen (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
